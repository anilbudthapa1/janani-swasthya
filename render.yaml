services:
  - type: web
    name: janani-swasthya
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janani-swasthya-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: janani-swasthya-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: janani_swasthya
    user: janani
    ipAllowList: []
