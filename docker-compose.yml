services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: janani_swasthya
      POSTGRES_USER: janani
      POSTGRES_PASSWORD: janani
    volumes:
      - janani_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janani -d janani_swasthya"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://janani:janani@db:5432/janani_swasthya?schema=public
      JWT_SECRET: change-this-secret-before-production
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:4000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Janani Swasthya <notifications@example.com>}
    depends_on:
      db:
        condition: service_healthy

volumes:
  janani_db:
